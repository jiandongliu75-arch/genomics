    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'" transform="translate(439.862446 334.478969)">arrival.</text>
   </g>
   <g id="text_17">
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; text-anchor: middle" x="289.390852" y="390.655686" transform="rotate(-0 289.390852 390.655686)">Ankrd1 and working CMs may respond differently within the same anatomical region</text>
   </g>
   <g id="text_18">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start" x="45.502187" y="208.620675" transform="rotate(-0 45.502187 208.620675)">Three competing explanations for regional CM development</text>
