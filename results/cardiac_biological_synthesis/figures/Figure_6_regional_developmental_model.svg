   </g>
   <g id="text_21">
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; text-anchor: start" x="52.818846" y="482.140967" transform="rotate(-0 52.818846 482.140967)">Co-measure perfusion, hypoxia, CM state and matrix organization; resolve temporal order.</text>
   </g>
   <g id="text_22">
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: start" x="52.818846" y="514.702536" transform="rotate(-0 52.818846 514.702536)">Match the starting CM identity</text>
   </g>
   <g id="text_23">
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; text-anchor: start" x="52.818846" y="533.645523" transform="rotate(-0 52.818846 533.645523)">Separate perfusion/oxygen, EC contact and fibroblast-derived matrix; measure respiration, calcium and force.</text>
   </g>
   <g id="text_24">
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: start" x="52.818846" y="566.207092" transform="rotate(-0 52.818846 566.207092)">Trace proposed state continuity</text>
   </g>
   <g id="text_25">
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; text-anchor: start" x="52.818846" y="585.15008" transform="rotate(-0 52.818846 585.15008)">Test early-to-late fibroblast ancestry; use transport to nominate comparisons, not to establish fate.</text>
   </g>
